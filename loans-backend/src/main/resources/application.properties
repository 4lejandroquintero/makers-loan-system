# ============================
# 1. SERVIDOR
# ============================
server.port=8080
spring.application.name=loans-backend

# ============================
# 2. BASE DE DATOS H2 (EN MEMORIA)
# ============================
spring.datasource.url=jdbc:h2:mem:loansdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================
# 3. CONSOLA VISUAL DE H2 EN EL NAVEGADOR
# ============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================
# 4. CONFIGURACION DE JPA / HIBERNATE
# ============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================
# 5. CONFIGURACION JWT
# ============================
jwt.secret=MakersLoanSystemSecretKey2026SuperSeguroParaFirmarTokensJWT
jwt.expiration=86400000